services:
  - type: web
    name: e585-rostering
    runtime: node
    plan: free
    # Same region as the Neon database (AWS Singapore), so each query is a short hop.
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /setup
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
